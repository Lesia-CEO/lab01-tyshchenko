    <main id="main-content container" class="content">
        <h1>Зворотний зв'язок</h1>
        <label class="contact-form__label" for="name">Ім'я</label>
        <input class="contact-form__field" type="text" id="name" name="name" required>
            <br><br>
            <label class="contact-form__label" for="email">Електронна пошта</label>
            <input class="contact-form__field" type="email" id="email" name="email" required>
            <br><br>
            <label class="contact-form__label" for="subject">Тема звернення</label>
            <select class="contact-form__field" id="subject" name="subject">
                <option value="question">Запитання</option>
                <option value="suggestion">Пропозиція</option>
                <option value="error">Повідомлення про помилку на сайті</option>
            </select>
            <br><br>
            <label class="contact-form__label">Текст повідомлення<br><textarea class="contact-form__field" id="message" name="message" rows="5" minlength="10" required></textarea></label>
            <br><br>
            <label>
                <input type="checkbox" name="consent" required>
                Погоджуюсь на обробку персональних даних
            </label>
            <br><br>
            <button class="contact-form__button" type="submit">Надіслати</button>
        </form>
